apiVersion: apps/v1
kind: Deployment
metadata:
  name:  result
  namespace: voting-app
  labels:
    app:  result
spec:
  selector:
    matchLabels:
      app: result
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  result
    spec:
      containers:
      - name:  result
        image:  voting-app/result:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        livenessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 5
          failureThreshold: 3
          periodSeconds: 10